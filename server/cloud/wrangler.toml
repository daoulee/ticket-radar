name = "ticketradar-shared-staging"
main = "worker.ts"
compatibility_date = "2026-11-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[build]
command = "node prepare.mjs"

[alias]
"./catalog.ts" = "./catalog.generated.ts"

[durable_objects]
bindings = [{ name = "MARKET", class_name = "SharedMarket" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SharedMarket"]
